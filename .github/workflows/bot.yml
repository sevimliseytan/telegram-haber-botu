name: Haber RSS -> Telegram

on:
  schedule:
    - cron: "*/5 * * * *"   # her 5 dakikada bir (GitHub bazen birkac dakika geciktirebilir)
  workflow_dispatch:         # elle calistirma dugmesi

permissions:
  contents: write            # state.json dosyasini kaydedebilmek icin

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Botu calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: "1"            # GECICI: bu tur sadece isaretler, gondermez
          ANAHTAR_KELIMELER: ""   # ornek: "son dakika,Balıkesir"  (bos = tum haberler)
        run: python bot.py

      - name: Son durumu kaydet
        if: always()
        run: |
          git config user.name "telegram-bot"
          git config user.email "telegram-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet && exit 0
          git commit -m "Son haber durumu guncellendi"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
